<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>هوش مصنوعی علی</title>

<style>
body{
    font-family:tahoma;
    background:#111827;
    color:white;
    margin:0;
}

.container{
    max-width:800px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
}

#chat{
    background:#1f2937;
    height:400px;
    overflow-y:auto;
    padding:15px;
    border-radius:10px;
    margin-bottom:10px;
}

.user{
    color:#60a5fa;
    margin:10px 0;
}

.bot{
    color:#34d399;
    margin:10px 0;
}

input{
    width:75%;
    padding:10px;
}

button{
    padding:10px;
}
</style>
</head>

<body>

<div class="container">
    <h1>هوش مصنوعی علی</h1>

    <div id="chat">
        <div class="bot">سلام! هر سوالی داری بپرس.</div>
    </div>

    <input id="userInput" placeholder="پیام خود را بنویس...">
    <button onclick="sendMessage()">ارسال</button>
</div>

<script>
function sendMessage(){

    let input = document.getElementById("userInput");
    let message = input.value.toLowerCase();

    if(message === "") return;

    let chat = document.getElementById("chat");

    chat.innerHTML +=
    `<div class="user">شما: ${message}</div>`;

    let response = "متوجه نشدم.";

    if(message.includes("سلام")){
        response = "سلام علی! خوش اومدی.";
    }

    else if(message.includes("اسم")){
        response = "من هوش مصنوعی سایت علی هستم.";
    }

    else if(message.includes("هوش مصنوعی")){
        response = "هوش مصنوعی فناوری ساخت سیستم‌هایی است که برخی کارهای فکری انسان را انجام می‌دهند.";
    }

    else if(message.includes("خداحافظ")){
        response = "خداحافظ! موفق باشی.";
    }

    chat.innerHTML +=
    `<div class="bot">ربات: ${response}</div>`;

    input.value = "";

    chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
